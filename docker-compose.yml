services:
  backend:
    build: ./backend
    container_name: olinda-backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - WATCHFILES_FORCE_POLLING=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-cambia-esta-clave-en-produccion}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-andres}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-vacas123456789}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  frontend:
    build: ./FRONTEND
    container_name: olinda-frontend
    volumes:
      - ./FRONTEND:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    command: sh -c "bun install && bunx vite dev --host 0.0.0.0 --port 5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
